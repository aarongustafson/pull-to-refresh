<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Custom Text Pull-to-Refresh Demo</title>
		<link rel="stylesheet" href="./demo-shell.css" />
		<link rel="stylesheet" href="./styles.css" />
		<link rel="stylesheet" href="./embedded.css" />
	</head>
	<body data-demo-page="embedded">
		<pull-to-refresh
			id="demo"
			indicator-text="⬇ Swipe down"
			release-text="🔄 Let go!"
			refreshing-text="⏳ Loading..."
		>
			<div class="demo-content">
				<h3>Custom Messages</h3>
				<p>Notice the different indicator text.</p>
				<p>
					Random number:
					<span class="random-number" id="random">0</span>
				</p>
				<div class="status" id="status" role="status">Ready</div>
				<form data-refresh><button type="submit">Refresh</button></form>
				<p>The Refresh button reloads the page if enhancement fails.</p>
				<noscript
					><p>
						JavaScript is off. Content remains available; use
						Refresh to reload.
					</p></noscript
				>
			</div>
		</pull-to-refresh>
		<footer>
			<p>
				Made with ❤️ by
				<a href="https://github.com/aarongustafson">Aaron Gustafson</a>.
				<a
					href="https://github.com/aarongustafson/pull-to-refresh/blob/main/README.md"
					>README</a
				>
				·
				<a href="https://github.com/aarongustafson/pull-to-refresh"
					>GitHub</a
				>.
			</p>
		</footer>
		<script src="./refresh.js" type="module"></script>

		<script src="../define.js" type="module"></script>
		<script>
			const demo = document.getElementById('demo');
			const random = document.getElementById('random');
			const status = document.getElementById('status');

			demo.addEventListener('ptr:refresh', (e) => {
				status.textContent = 'Refreshing...';
				setTimeout(() => {
					random.textContent = Math.floor(Math.random() * 1000);
					e.detail.complete();
				}, 1500);
			});

			demo.addEventListener('ptr:refresh-complete', () => {
				status.textContent = 'Complete! Pull again to refresh.';
			});
		</script>
	</body>
</html>
