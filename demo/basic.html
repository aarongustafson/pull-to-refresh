<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Basic Pull-to-Refresh Demo</title>
		<link rel="stylesheet" href="./styles.css" />
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			html,
			body {
				height: 100%;
				background: Canvas;
				color: CanvasText;
				font-family:
					-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
					Oxygen, Ubuntu, Cantarell, sans-serif;
			}

			.demo-content {
				padding: 1rem;
			}

			.demo-content h3 {
				margin-top: 0;
				margin-bottom: 1rem;
			}

			.status {
				background: Canvas;
				color: CanvasText;
				padding: 10px;
				margin: 10px 0;
				border-radius: 4px;
				font-family: monospace;
				font-size: 0.75rem;
			}
			.random-number {
				font-weight: bold;
				color: inherit;
			}
		</style>
	</head>
	<body>
		<pull-to-refresh id="demo">
			<div class="demo-content">
				<h3>My Content</h3>
				<p>Scroll down and pull from the top to refresh.</p>
				<p>
					Random number:
					<span class="random-number" id="random">0</span>
				</p>
				<div class="status" id="status" role="status">Ready</div>
				<label
					><input type="checkbox" id="fail-refresh" /> Simulate a
					failed refresh</label
				>
				<form data-refresh><button type="submit">Refresh</button></form>
				<p>The Refresh button reloads the page if enhancement fails.</p>
				<noscript
					><p>
						JavaScript is off. Your content remains available; use
						Refresh to reload.
					</p></noscript
				>
			</div>
		</pull-to-refresh>
		<footer>
			<p>
				Made with ❤️ by
				<a href="https://github.com/aarongustafson">Aaron Gustafson</a>.
				<a
					href="https://github.com/aarongustafson/pull-to-refresh/blob/main/README.md"
					>README</a
				>
				·
				<a href="https://github.com/aarongustafson/pull-to-refresh"
					>GitHub</a
				>.
			</p>
		</footer>
		<script src="./refresh.js" type="module"></script>

		<script src="../define.js" type="module"></script>
		<script>
			const demo = document.getElementById('demo');
			const random = document.getElementById('random');
			const status = document.getElementById('status');

			demo.addEventListener('ptr:refresh', (e) => {
				status.textContent = 'Refreshing...';
				setTimeout(() => {
					const failure = document.getElementById('fail-refresh');
					if (failure.checked) {
						failure.checked = false;
						e.detail.complete();
						status.textContent =
							'Refresh failed. Your previous number is unchanged. Use Refresh to try again.';
						return;
					}
					random.textContent = Math.floor(Math.random() * 1000);
					e.detail.complete();
				}, 1500);
			});

			demo.addEventListener('ptr:refresh-complete', () => {
				status.textContent = 'Complete! Pull again to refresh.';
			});
		</script>
	</body>
</html>
