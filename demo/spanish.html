<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Actualizar al deslizar</title>
		<link rel="stylesheet" href="./demo-shell.css" />
		<link rel="stylesheet" href="./styles.css" />
		<link rel="stylesheet" href="./embedded.css" />
	</head>
	<body data-demo-page="embedded">
		<section id="spanish-refresh">
			<pull-to-refresh id="demo">
				<div class="demo-content">
					<h3>Contenido en Español</h3>
					<p>Los mensajes aparecen en español.</p>
					<p>
						Número aleatorio:
						<span class="random-number" id="random">0</span>
					</p>
					<div class="status" id="status" role="status">Listo</div>
					<form data-refresh>
						<button type="submit">Actualizar</button>
					</form>
					<p>
						Si la mejora falla, este botón vuelve a cargar la
						página.
					</p>
					<noscript
						><p>
							JavaScript está desactivado. El contenido sigue
							disponible; use Actualizar para recargar.
						</p></noscript
					>
				</div>
			</pull-to-refresh>
		</section>
		<footer>
			<p>
				Creado con ❤️ por
				<a href="https://github.com/aarongustafson">Aaron Gustafson</a>.
				<a
					href="https://github.com/aarongustafson/pull-to-refresh/blob/main/README.md"
					>README</a
				>
				·
				<a href="https://github.com/aarongustafson/pull-to-refresh"
					>GitHub</a
				>.
			</p>
		</footer>
		<script src="./refresh.js" type="module"></script>

		<script src="../define.js" type="module"></script>
		<script>
			const demo = document.getElementById('demo');
			const random = document.getElementById('random');
			const status = document.getElementById('status');

			demo.addEventListener('ptr:refresh', (e) => {
				status.textContent = 'Actualizando...';
				setTimeout(() => {
					try {
						random.textContent = Math.floor(Math.random() * 1000);
						status.textContent =
							'¡Completo! Use Actualizar o deslice de nuevo.';
					} catch {
						status.textContent =
							'No se pudo actualizar. El número anterior no ha cambiado. Use Actualizar para volver a intentarlo.';
					} finally {
						e.detail.complete();
					}
				}, 1500);
			});
		</script>
	</body>
</html>
