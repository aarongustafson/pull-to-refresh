<!doctype html>
<html lang="ja">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Japanese Pull-to-Refresh Demo</title>
		<link rel="stylesheet" href="./styles.css" />
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			html,
			body {
				height: 100%;
				background: Canvas;
				color: CanvasText;
				font-family:
					-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
					Oxygen, Ubuntu, Cantarell, sans-serif;
			}

			pull-to-refresh {
				height: 100%;
			}
			.demo-content {
				padding: 20px;
			}

			.demo-content h3 {
				margin-top: 0;
				margin-bottom: 1rem;
			}

			.status {
				background: Canvas;
				color: CanvasText;
				padding: 10px;
				margin: 10px 0;
				border-radius: 4px;
				font-family: monospace;
				font-size: 0.75rem;
			}
			.random-number {
				font-weight: bold;
				color: inherit;
			}
		</style>
	</head>
	<body>
		<pull-to-refresh id="demo">
			<div class="demo-content">
				<h3>日本語のコンテンツ</h3>
				<p>メッセージが日本語で表示されます。</p>
				<p>
					ランダム番号:
					<span class="random-number" id="random">0</span>
				</p>
				<div class="status" id="status" role="status">準備完了</div>
				<form data-refresh><button type="submit">更新</button></form>
				<p>
					機能を読み込めない場合、このボタンでページを再読み込みできます。
				</p>
				<noscript
					><p>
						JavaScript
						は無効です。コンテンツは引き続き利用できます。「更新」で再読み込みしてください。
					</p></noscript
				>
			</div>
		</pull-to-refresh>
		<footer>
			<p>
				制作 ❤️
				<a href="https://github.com/aarongustafson">Aaron Gustafson</a
				>。<a
					href="https://github.com/aarongustafson/pull-to-refresh/blob/main/README.md"
					>README</a
				>
				·
				<a href="https://github.com/aarongustafson/pull-to-refresh"
					>GitHub</a
				>。
			</p>
		</footer>
		<script src="./refresh.js" type="module"></script>

		<script src="../define.js" type="module"></script>
		<script>
			const demo = document.getElementById('demo');
			const random = document.getElementById('random');
			const status = document.getElementById('status');

			demo.addEventListener('ptr:refresh', (e) => {
				status.textContent = '更新中...';
				setTimeout(() => {
					random.textContent = Math.floor(Math.random() * 1000);
					e.detail.complete();
				}, 1500);
			});

			demo.addEventListener('ptr:refresh-complete', () => {
				status.textContent =
					'完了！もう一度引っ張って更新してください。';
			});
		</script>
	</body>
</html>
